<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Подстраиваем страницу под экран телефона/планшета, запрещаем случайный зум -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Зарядка</title>

  <!-- Официальная библиотека Telegram для Mini App. Подключается первой. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Наши данные. ?v=3 — номер версии: меняйте его при каждом
       изменении data.js, иначе телефон может показать старую копию. -->
  <script src="data.js?v=3"></script>

  <style>
    /* Цвета берём из темы Telegram; после запятой — запасной цвет для браузера */
    :root {
      --bg:     var(--tg-theme-bg-color, #ffffff);
      --text:   var(--tg-theme-text-color, #000000);
      --hint:   var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card:   var(--tg-theme-secondary-bg-color, #f1f1f4);
      /* Цвета фаз тренировки */
      --work: var(--button);
      --rest: #34c759;
      --prep: #ff9500;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

    /* Экраны: виден только один, у которого нет класса hidden */
    .screen {
      min-height: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 16px 28px;
    }
    .hidden { display: none !important; }
    .hint { color: var(--hint); }

    /* Карточка-строка (как «Вид практики» на референсе) */
    .row-card {
      display: flex; align-items: center; gap: 12px;
      width: 100%; text-align: left;
      background: var(--card); border-radius: 18px;
      padding: 16px 18px; min-height: 72px;
    }
    .row-card .label { font-size: 14px; color: var(--hint); }
    .row-card .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
    .row-card .grow  { flex: 1; min-width: 0; }
    .row-card .chev  { font-size: 26px; color: var(--hint); }

    /* Большая кнопка «Начать занятие» */
    .big-btn {
      width: 100%; min-height: 60px; border-radius: 30px;
      font-size: 20px; font-weight: 600;
      color: var(--button-text);
      background: linear-gradient(90deg, var(--button), color-mix(in srgb, var(--button) 55%, #ffffff));
    }
    .big-btn:active { transform: scale(0.98); }

    /* ---------- Главный экран ---------- */
    /* Строка «Направление» + шестерёнка справа в один уровень */
    .dir-line { display: flex; gap: 12px; align-items: stretch; }
    .dir-line .row-card { flex: 1; min-width: 0; }
    .gear-btn {
      flex: 0 0 72px; min-height: 72px; border-radius: 18px;
      background: var(--card); color: var(--hint);
      display: flex; align-items: center; justify-content: center;
    }
    .gear-btn svg { width: 30px; height: 30px; }
    .gear-btn:active { transform: scale(0.96); }

    .home-body { display: flex; flex-direction: column; gap: 14px; }

    /* Круглый регулятор минут */
    .dial-wrap { display: flex; justify-content: center; padding: 8px 0 4px; }
    #dial { width: min(78vw, 340px); height: auto; touch-action: none; cursor: pointer; }
    #dial .track { stroke: var(--card); }
    #dial .arc   { stroke: var(--button); transition: stroke-dashoffset .08s linear; }
    #dial .knob  { fill: var(--bg); stroke: var(--button); }
    #dial .num   { fill: var(--text); font-size: 92px; font-weight: 700; }
    #dial .unit  { fill: var(--hint); font-size: 22px; }

    #summary { text-align: center; font-size: 15px; }
    details.preview { background: var(--card); border-radius: 18px; padding: 14px 18px; }
    details.preview summary { font-size: 15px; color: var(--hint); cursor: pointer; }
    details.preview ol { margin: 10px 0 0; padding-left: 22px; font-size: 15px; line-height: 1.5; }
    details.preview .reps { color: var(--hint); }

    /* ---------- Экран выбора направления ---------- */
    #directions h2 { font-size: 24px; margin: 4px 0 14px; }
    #dir-list { display: grid; gap: 12px; }
    .dir-card {
      text-align: left; width: 100%;
      background: var(--card); border-radius: 18px; padding: 16px 18px;
      border: 2px solid transparent;
    }
    .dir-card.selected { border-color: var(--button); }
    .dir-card .title { font-size: 19px; font-weight: 600; }
    .dir-card .title .tick { color: var(--button); float: right; }
    .dir-card .about { font-size: 15px; margin-top: 6px; }
    .dir-card .list  { font-size: 13px; color: var(--hint); margin-top: 6px; line-height: 1.4; }

    /* ---------- Экран тренировки ----------
       Весь экран — видео. Поверх него, слева сверху: время и название.
       Кнопок нет: касание экрана ставит паузу / продолжает. */
    #workout {
      position: fixed; inset: 0;
      max-width: none; margin: 0; padding: 0;
      overflow: hidden; cursor: pointer;
      background: #cfcfcf;
    }
    /* Слой видео. Пока видео нет — светло-серый «фон студии» как на образце */
    .video-layer {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #e9e9e9 0%, #dcdcdc 55%, #cfcfcf 100%);
    }
    #ex-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #video-stub {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(0,0,0,.25); font-size: 15px;
    }
    /* Лёгкое затемнение, чтобы белый текст читался на любом видео */
    .video-shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 35%);
      pointer-events: none;
    }

    /* Время и название — левый верхний угол */
    .wo-label {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 18px);
      left: calc(env(safe-area-inset-left, 0px) + 22px);
      right: 22px;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,.45);
      pointer-events: none;
      z-index: 2; /* время видно и на паузе */
    }
    .wo-main { display: flex; align-items: baseline; gap: 0.7em; flex-wrap: wrap;
               font-size: clamp(28px, 7vw, 46px); line-height: 1.15; }
    #clock { font-variant-numeric: tabular-nums; }
    #wo-sub { font-size: clamp(15px, 3.6vw, 20px); margin-top: 6px; opacity: .95; }

    /* Пауза: экран темнеет, по центру значок */
    #pause-layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: rgba(0,0,0,.45); color: #fff; pointer-events: none;
    }
    #pause-layer .icon { font-size: 72px; line-height: 1; }
    #pause-layer .txt  { font-size: 17px; }
    #workout.paused #video-stub { visibility: hidden; }

    /* ---------- Экран «Готово» ---------- */
    #done { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
    #done .emoji { font-size: 80px; }
    #done h2 { font-size: 30px; margin: 0; }
    #done p { font-size: 17px; margin: 0 0 12px; }

    /* ---------- Планшет в ландшафте: две колонки ---------- */
    @media (min-width: 700px) and (orientation: landscape) {
      .home-body { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 18px 32px; }
      .home-body .dial-wrap { grid-row: span 4; }
      #dial { width: min(42vw, 400px); }
      #dir-list { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- =============== ГЛАВНЫЙ ЭКРАН =============== -->
  <section id="home" class="screen">
    <div class="home-body">
      <!-- Круглый регулятор: тяните синюю точку по кругу -->
      <div class="dial-wrap">
        <svg id="dial" viewBox="0 0 300 300" aria-label="Длительность в минутах">
          <circle class="track" cx="150" cy="150" r="128" fill="none" stroke-width="10"/>
          <circle class="arc" id="dial-arc" cx="150" cy="150" r="128" fill="none" stroke-width="10"
                  stroke-linecap="round" transform="rotate(-90 150 150)"/>
          <text class="num"  id="dial-num" x="150" y="165" text-anchor="middle">10</text>
          <text class="unit" x="150" y="200" text-anchor="middle">мин.</text>
          <circle class="knob" id="dial-knob" cx="150" cy="22" r="15" stroke-width="9"/>
        </svg>
      </div>

      <!-- Направление + шестерёнка настроек справа -->
      <div class="dir-line">
        <button class="row-card" id="open-directions">
          <div class="grow">
            <div class="label">Направление</div>
            <div class="value" id="dir-name">Общий комплекс</div>
          </div>
          <span class="chev">›</span>
        </button>
        <button class="gear-btn" id="settings-btn" aria-label="Настройки">
          <!-- Значок шестерёнки -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>

      <div id="summary" class="hint"></div>

      <button class="big-btn" id="start-btn">Начать занятие</button>

      <details class="preview">
        <summary>Что войдёт в занятие</summary>
        <ol id="preview-list"></ol>
      </details>
    </div>
  </section>

  <!-- =============== ВЫБОР НАПРАВЛЕНИЯ =============== -->
  <section id="directions" class="screen hidden">
    <h2>Направление</h2>
    <div id="dir-list"></div>
  </section>

  <!-- =============== ТРЕНИРОВКА ===============
       Касание в любом месте экрана — пауза / продолжить. -->
  <section id="workout" class="screen hidden">
    <!-- Видеоряд (сформируем позже). Пока — серый фон-заглушка. -->
    <div class="video-layer">
      <video id="ex-video" class="hidden" muted loop playsinline webkit-playsinline></video>
      <div id="video-stub">видео упражнения появится позже</div>
    </div>
    <div class="video-shade"></div>

    <!-- Время и название упражнения: левый верхний угол -->
    <div class="wo-label">
      <div class="wo-main">
        <span id="clock">0:30</span>
        <span id="ex-name"></span>
      </div>
      <div id="wo-sub"></div>
    </div>

    <!-- Показывается только на паузе -->
    <div id="pause-layer" class="hidden">
      <div class="icon">▶</div>
      <div class="txt">Пауза — коснитесь, чтобы продолжить</div>
    </div>
  </section>

  <!-- =============== ГОТОВО =============== -->
  <section id="done" class="screen hidden">
    <div class="emoji">🎉</div>
    <h2>Готово!</h2>
    <p id="done-text"></p>
    <button class="big-btn" id="home-btn" style="max-width:420px">На главную</button>
  </section>

  <script>
    // =====================================================================
    //  1. Подключение к Telegram
    // =====================================================================
    const tg = window.Telegram && window.Telegram.WebApp;
    const inTelegram = !!(tg && tg.initData);

    if (inTelegram) {
      tg.ready();
      tg.expand();
      // Чтобы свайп по кругу не закрывал приложение (есть в новых версиях)
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
        tg.disableVerticalSwipes();
      }
    }

    // Вибрация через Telegram (в браузере просто ничего не делает)
    function haptic(kind) {
      if (!inTelegram || !tg.HapticFeedback) return;
      if (kind === 'select')  tg.HapticFeedback.selectionChanged();
      else if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(kind); // 'light' | 'medium' | 'heavy'
    }

    // Короткий звуковой сигнал (создаётся после первого нажатия — так требует iOS)
    let audio = null;
    function initAudio() {
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
      } catch (e) { audio = null; }
    }
    function beep(freq = 880, ms = 120) {
      if (!audio) return;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.25, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + ms / 1000);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + ms / 1000);
    }

    // Не даём экрану погаснуть (Wake Lock). Если не поддерживается — молча пропускаем.
    let wakeLock = null;
    async function keepScreenOn() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
      catch (e) { wakeLock = null; }
    }
    function releaseScreen() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }
    // При возврате в приложение блокировку надо взять заново
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && current === 'workout') keepScreenOn();
    });

    // =====================================================================
    //  2. Переключение экранов и кнопка «Назад» Telegram
    // =====================================================================
    let current = 'home';
    function show(name) {
      ['home', 'directions', 'workout', 'done'].forEach(id =>
        document.getElementById(id).classList.toggle('hidden', id !== name));
      current = name;
      window.scrollTo(0, 0);
      if (inTelegram) {
        if (name === 'directions' || name === 'workout') tg.BackButton.show();
        else tg.BackButton.hide();
      }
    }

    function onBack() {
      if (current === 'directions') show('home');
      else if (current === 'workout') askExit();
    }
    if (inTelegram) tg.BackButton.onClick(onBack);

    // =====================================================================
    //  3. Главный экран: выбор минут и направления
    // =====================================================================
    const state = {
      minutes: DEFAULT_MINUTES,
      direction: DEFAULT_DIRECTION,
      workout: null, // собранная тренировка
    };

    // --- Круглый регулятор ---
    const dial = document.getElementById('dial');
    const dialArc = document.getElementById('dial-arc');
    const dialKnob = document.getElementById('dial-knob');
    const dialNum = document.getElementById('dial-num');
    const R = 128, C = 2 * Math.PI * R; // радиус и длина окружности
    dialArc.setAttribute('stroke-dasharray', C);

    function drawDial() {
      const frac = state.minutes / MAX_MINUTES;          // доля круга 0..1
      dialArc.setAttribute('stroke-dashoffset', C * (1 - frac));
      const angle = frac * 2 * Math.PI - Math.PI / 2;      // от верхней точки по часовой
      dialKnob.setAttribute('cx', 150 + R * Math.cos(angle));
      dialKnob.setAttribute('cy', 150 + R * Math.sin(angle));
      dialNum.textContent = state.minutes;
    }

    // Перевести точку касания в минуты
    function minutesFromPointer(e) {
      const box = dial.getBoundingClientRect();
      const x = e.clientX - (box.left + box.width / 2);
      const y = e.clientY - (box.top + box.height / 2);
      let angle = Math.atan2(y, x) + Math.PI / 2;          // 0 — сверху
      if (angle < 0) angle += 2 * Math.PI;
      let m = Math.round(angle / (2 * Math.PI) * MAX_MINUTES);
      // Не даём «перескочить» через верх круга с 30 на 0 и обратно
      if (state.minutes >= MAX_MINUTES - 5 && m <= 5) m = MAX_MINUTES;
      if (state.minutes <= MIN_MINUTES + 5 && m >= MAX_MINUTES - 5) m = MIN_MINUTES;
      return Math.min(MAX_MINUTES, Math.max(MIN_MINUTES, m));
    }

    function setMinutes(m) {
      if (m === state.minutes) return;
      state.minutes = m;
      haptic('select');
      drawDial();
      updatePlan();
    }

    let dragging = false;
    dial.addEventListener('pointerdown', e => {
      dragging = true;
      dial.setPointerCapture(e.pointerId);
      setMinutes(minutesFromPointer(e));
    });
    dial.addEventListener('pointermove', e => { if (dragging) setMinutes(minutesFromPointer(e)); });
    dial.addEventListener('pointerup',     () => { dragging = false; });
    dial.addEventListener('pointercancel', () => { dragging = false; });

    // --- Пересобрать тренировку под выбор и показать сводку ---
    function updatePlan() {
      const dir = getDirection(state.direction);
      state.workout = buildWorkout(state.direction, state.minutes);
      const list = state.workout.exercises;

      document.getElementById('dir-name').textContent = dir.short;
      document.getElementById('summary').textContent =
        list.length + ' ' + plural(list.length, 'упражнение', 'упражнения', 'упражнений') +
        ' · ≈ ' + formatDuration(workoutDuration(state.workout));

      const ol = document.getElementById('preview-list');
      ol.innerHTML = '';
      list.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item.name + ' ';
        const extra = document.createElement('span');
        extra.className = 'reps';
        extra.textContent = item.type === 'reps'
          ? '— ' + item.reps + ' раз'
          : '— ' + formatDuration(item.duration);
        li.append(extra);
        ol.append(li);
      });
    }

    // --- Экран выбора направления ---
    function renderDirections() {
      const box = document.getElementById('dir-list');
      box.innerHTML = '';
      DIRECTIONS.forEach(dir => {
        const card = document.createElement('button');
        card.className = 'dir-card' + (dir.id === state.direction ? ' selected' : '');

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = dir.name;
        if (dir.id === state.direction) {
          const tick = document.createElement('span');
          tick.className = 'tick';
          tick.textContent = '✓';
          title.append(tick);
        }
        const about = document.createElement('div');
        about.className = 'about';
        about.textContent = dir.description;

        // Какие упражнения встречаются в направлении (без повторов)
        const ids = [...new Set([...dir.warmup, ...dir.main, ...dir.cool])];
        const list = document.createElement('div');
        list.className = 'list';
        list.textContent = ids.map(id => getExercise(id).name).join(' · ');

        card.append(title, about, list);
        card.addEventListener('click', () => {
          state.direction = dir.id;
          haptic('select');
          updatePlan();
          show('home');
        });
        box.append(card);
      });
    }

    document.getElementById('open-directions').addEventListener('click', () => {
      renderDirections();
      show('directions');
    });

    // =====================================================================
    //  4. Тренировка: таймер
    // =====================================================================
    /*
      Тренировка — это список шагов:
        prep (5 с «приготовьтесь») → work → rest → work → rest → … → work
      У каждого шага: kind, dur (секунды), ex (упражнение), index (номер упражнения).
    */
    const PREP_SECONDS = 5;
    let steps = [];
    let stepIndex = 0;
    let remaining = 0;   // сколько секунд осталось в текущем шаге
    let paused = false;
    let timerId = null;
    let lastTick = 0;
    let lastWhole = 0;   // для сигнала на 3-2-1

    function buildSteps(workout) {
      const list = workout.exercises;
      const result = [{ kind: 'prep', dur: PREP_SECONDS, ex: list[0], index: 0 }];
      list.forEach((item, i) => {
        result.push({ kind: 'work', dur: item.duration, ex: item, index: i });
        if (i < list.length - 1 && item.rest > 0) {
          result.push({ kind: 'rest', dur: item.rest, ex: list[i + 1], index: i + 1 });
        }
      });
      return result;
    }

    function startWorkout() {
      initAudio();
      steps = buildSteps(state.workout);
      paused = false;
      renderPause();
      show('workout');
      keepScreenOn();
      goToStep(0);
      clearInterval(timerId);
      lastTick = Date.now();
      timerId = setInterval(tick, 100);
    }

    function goToStep(i) {
      stepIndex = i;
      const step = steps[i];
      remaining = step.dur;
      lastWhole = Math.ceil(remaining);
      renderStep();
      if (step.kind === 'work') { beep(1046, 250); haptic('heavy'); }
      else if (step.kind === 'rest') { beep(660, 200); haptic('medium'); }
    }

    // Вызывается 10 раз в секунду
    function tick() {
      const now = Date.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      if (paused) return;

      remaining -= dt;
      const whole = Math.ceil(remaining);
      if (whole !== lastWhole) {
        lastWhole = whole;
        // Короткие сигналы на 3, 2, 1
        if (whole >= 1 && whole <= 3) { beep(880, 90); haptic('light'); }
      }

      if (remaining <= 0) {
        if (stepIndex < steps.length - 1) goToStep(stepIndex + 1);
        else finishWorkout();
        return;
      }
      renderTime();
    }

    // Показать видео, название и подпись под ним
    function renderStep() {
      const step = steps[stepIndex];
      const ex = step.ex; // на отдыхе и подготовке — следующее упражнение

      document.getElementById('ex-name').textContent = '«' + ex.name + '»';

      // Вторая строка: что сейчас происходит
      let sub = '';
      if (step.kind === 'prep') sub = 'Приготовьтесь';
      else if (step.kind === 'rest') sub = 'Отдых · далее это упражнение';
      else if (ex.type === 'reps') sub = ex.reps + ' раз';
      document.getElementById('wo-sub').textContent = sub;

      setVideo(ex);
      renderTime();
    }

    // Видео упражнения. Пока ссылок нет — показываем заглушку.
    const video = document.getElementById('ex-video');
    function setVideo(ex) {
      const url = ex.video_url || '';
      const has = url !== '';
      video.classList.toggle('hidden', !has);
      document.getElementById('video-stub').classList.toggle('hidden', has);
      if (!has) { video.removeAttribute('src'); return; }
      if (video.getAttribute('src') !== url) video.src = url;
      if (!paused) video.play().catch(() => {});
    }

    function renderTime() {
      document.getElementById('clock').textContent = formatClock(remaining);
    }

    // --- Пауза / продолжить: касание по экрану ---
    function renderPause() {
      document.getElementById('pause-layer').classList.toggle('hidden', !paused);
      document.getElementById('workout').classList.toggle('paused', paused);
      if (video.getAttribute('src')) {
        if (paused) video.pause(); else video.play().catch(() => {});
      }
    }
    function togglePause() {
      paused = !paused;
      renderPause();
      haptic('medium');
    }
    document.getElementById('workout').addEventListener('click', togglePause);

    // Выход по кнопке «Назад» Telegram: ставим паузу и спрашиваем
    function askExit() {
      const wasPaused = paused;
      if (!paused) togglePause();
      const exit = ok => {
        if (ok) stopWorkout(); else if (!wasPaused) togglePause();
      };
      if (inTelegram) tg.showConfirm('Закончить занятие?', exit);
      else exit(window.confirm('Закончить занятие?'));
    }

    function stopWorkout() {
      clearInterval(timerId);
      releaseScreen();
      show('home');
    }

    function finishWorkout() {
      clearInterval(timerId);
      releaseScreen();
      beep(1318, 400);
      haptic('success');
      const n = state.workout.exercises.length;
      document.getElementById('done-text').textContent =
        formatDuration(workoutDuration(state.workout)) + ' · ' +
        n + ' ' + plural(n, 'упражнение', 'упражнения', 'упражнений');
      show('done');
    }

    // =====================================================================
    //  5. Запуск
    // =====================================================================
    document.getElementById('start-btn').addEventListener('click', () => {
      haptic('medium');
      startWorkout();
    });
    document.getElementById('home-btn').addEventListener('click', () => show('home'));

    // Шестерёнка: экран настроек сделаем на следующем шаге, пока — сообщение
    document.getElementById('settings-btn').addEventListener('click', () => {
      haptic('light');
      const msg = 'Настройки появятся на следующем этапе.';
      if (inTelegram) tg.showAlert(msg); else alert(msg);
    });

    drawDial();
    updatePlan();
    show('home');
  </script>
</body>
</html>
